name: Since
options:
  bundleIdPrefix: me.wherar3y0
  deploymentTarget:
    iOS: "27.2"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # As in Xcode's own project template: lets Xcode read the strings in code into the string catalogs,
    # AppShortcuts.xcstrings with the Russian Siri phrases among them. Without it every phrase was "stale".
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    # The free personal team from the Apple ID signed in to Xcode: enough to run on your own iPhone.
    DEVELOPMENT_TEAM: A2Z92WBNMC
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Since:
    type: application
    platform: iOS
    sources:
      - path: Since
        excludes: [App/AppIcon.icon]
      - Shared
      # The Icon Composer icon is one file to Xcode, not a folder of SVGs.
      - path: Since/App/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.wherar3y0.since
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Since/Info.plist
      properties:
        CFBundleDisplayName: Since
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ru]
        INAlternativeAppNames:
          - INAlternativeAppName: Синс
        NSUserActivityTypes: [me.wherar3y0.since.counter, me.wherar3y0.since.countdown]
        NSCalendarsFullAccessUsageDescription: Since reads your calendars so you can pick events to count down to. Nothing leaves your iPhone.
        NSRemindersFullAccessUsageDescription: Since reads the Reminders lists you choose so their tasks appear as countdowns, and ticks a task off when you mark it done.
        NSLocationWhenInUseUsageDescription: Since uses your location only when you ask how long it takes to get to a countdown's place.
        # Directions can open in these, when they're on the iPhone.
        LSApplicationQueriesSchemes: [yandexmaps, comgooglemaps]
        # A countdown's day can be shown on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: me.wherar3y0.since
            CFBundleURLSchemes: [since]
    entitlements:
      path: Since/Since.entitlements
      properties:
        com.apple.security.application-groups: [group.me.wherar3y0.since]
    dependencies:
      - target: SinceWidgets
      - target: SinceShare
      - target: SinceMessages

  SinceWidgets:
    type: app-extension
    platform: iOS
    sources: [SinceWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.wherar3y0.since.widgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: SinceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Since
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SinceWidgets/SinceWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.me.wherar3y0.since]

  SinceShare:
    type: app-extension
    platform: iOS
    sources:
      - SinceShare
      - Shared
      - Since/Until/ParcelScanner.swift
      - Since/App/Milestones.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.wherar3y0.since.share
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: SinceShare/Info.plist
      properties:
        CFBundleDisplayName: Since
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: SinceShare/SinceShare.entitlements
      properties:
        com.apple.security.application-groups: [group.me.wherar3y0.since]

  SinceMessages:
    type: app-extension.messages
    platform: iOS
    sources: [SinceMessages, Shared, Since/App/Milestones.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.wherar3y0.since.messages
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # No separate icon catalog yet; use the extension's display name in Messages.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: SinceMessages/Info.plist
      properties:
        CFBundleDisplayName: Since
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionMainStoryboard: MainInterface
    entitlements:
      path: SinceMessages/SinceMessages.entitlements
      properties:
        com.apple.security.application-groups: [group.me.wherar3y0.since]

  SinceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SinceTests]
    dependencies:
      - target: Since
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.wherar3y0.since.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Since:
    build:
      targets:
        Since: all
    test:
      targets: [SinceTests]
